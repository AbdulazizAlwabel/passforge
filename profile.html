<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Profile — PassForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root, [data-theme="light"] {
  --color-bg: #f4f4f0; --color-surface: #f8f8f5; --color-surface-2: #ffffff;
  --color-surface-offset: #ebebe6; --color-border: oklch(0.3 0 0 / 0.10);
  --color-divider: oklch(0.3 0 0 / 0.07); --color-text: #1a1a18;
  --color-text-muted: #6b6b68; --color-text-faint: #b0b0ac;
  --color-text-inverse: #f8f8f5; --color-primary: #1a6b4a;
  --color-primary-hover: #145538; --color-primary-active: #0e3f28;
  --color-primary-highlight: #d0e8dd;
  --color-success: #1a6b4a; --color-warning: #b05a10; --color-error: #c0392b;
  --shadow-sm: 0 1px 3px oklch(0.1 0 0 / 0.07);
  --shadow-md: 0 4px 16px oklch(0.1 0 0 / 0.08);
  --shadow-lg: 0 12px 40px oklch(0.1 0 0 / 0.10);
  --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
  --radius-xl: 1rem; --radius-2xl: 1.5rem; --radius-full: 9999px;
  --font-mono: 'JetBrains Mono','Fira Code',monospace;
  --font-body: 'Inter',system-ui,sans-serif;
  --text-xs: clamp(0.75rem,0.7rem + 0.25vw,0.875rem);
  --text-sm: clamp(0.875rem,0.8rem + 0.35vw,1rem);
  --text-base: clamp(1rem,0.95rem + 0.25vw,1.125rem);
  --text-lg: clamp(1.125rem,1rem + 0.75vw,1.5rem);
  --text-xl: clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --space-12:3rem;--space-16:4rem;
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
}
[data-theme="dark"] {
  --color-bg:#121210;--color-surface:#181816;--color-surface-2:#1e1e1c;
  --color-surface-offset:#242422;--color-border:oklch(1 0 0 / 0.08);
  --color-divider:oklch(1 0 0 / 0.05);--color-text:#e8e8e4;
  --color-text-muted:#888884;--color-text-faint:#505050;
  --color-text-inverse:#121210;--color-primary:#3dba7e;
  --color-primary-hover:#2da066;--color-primary-active:#208750;
  --color-primary-highlight:#1a3028;
  --color-success:#2ecc71;--color-warning:#e67e22;--color-error:#e74c3c;
  --shadow-sm:0 1px 3px oklch(0 0 0/0.25);
  --shadow-md:0 4px 16px oklch(0 0 0/0.35);
  --shadow-lg:0 12px 40px oklch(0 0 0/0.45);
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){
  --color-bg:#121210;--color-surface:#181816;--color-surface-2:#1e1e1c;
  --color-surface-offset:#242422;--color-border:oklch(1 0 0/0.08);
  --color-divider:oklch(1 0 0/0.05);--color-text:#e8e8e4;
  --color-text-muted:#888884;--color-text-faint:#505050;
  --color-text-inverse:#121210;--color-primary:#3dba7e;
  --color-primary-hover:#2da066;--color-primary-active:#208750;
  --color-primary-highlight:#1a3028;
  --color-success:#2ecc71;--color-warning:#e67e22;--color-error:#e74c3c;
  --shadow-sm:0 1px 3px oklch(0 0 0/0.25);
  --shadow-md:0 4px 16px oklch(0 0 0/0.35);
  --shadow-lg:0 12px 40px oklch(0 0 0/0.45);
}}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;}
body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);
  color:var(--color-text);background:var(--color-bg);
  transition:background var(--transition),color var(--transition);}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit;}
input{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm);}

/* HEADER (matches site) */
.site-header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in oklch,var(--color-bg) 85%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--color-divider);
  padding:var(--space-4) var(--space-6);
  display:flex;align-items:center;justify-content:space-between;
}
.logo{display:flex;align-items:center;gap:var(--space-3);}
.logo-mark{width:34px;height:34px;color:var(--color-primary);flex-shrink:0;}
.logo-name{font-family:var(--font-mono);font-weight:700;font-size:var(--text-lg);
  letter-spacing:-0.02em;color:var(--color-text);}
.logo-name span{color:var(--color-primary);}
.header-actions{display:flex;align-items:center;gap:var(--space-3);}
.theme-toggle{width:40px;height:40px;border-radius:var(--radius-full);
  display:flex;align-items:center;justify-content:center;
  color:var(--color-text-muted);border:1px solid var(--color-border);
  background:var(--color-surface);transition:all var(--transition);}
.theme-toggle:hover{color:var(--color-text);background:var(--color-surface-offset);}
.back-link{display:inline-flex;align-items:center;gap:var(--space-2);
  font-size:var(--text-sm);color:var(--color-text-muted);}
.back-link:hover{color:var(--color-primary);}

/* PAGE */
.page-wrap{max-width:640px;margin:0 auto;padding:var(--space-10) var(--space-6) var(--space-16);}
.page-title{font-family:var(--font-mono);font-size:var(--text-xl);font-weight:700;
  letter-spacing:-0.02em;margin-bottom:var(--space-8);}

.profile-card{
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-2xl);box-shadow:var(--shadow-lg);
  overflow:hidden;margin-bottom:var(--space-6);
}
.profile-header{
  padding:var(--space-8) var(--space-6);
  display:flex;flex-direction:column;align-items:center;gap:var(--space-4);
  border-bottom:1px solid var(--color-divider);background:var(--color-surface-2);
}
.avatar{
  width:76px;height:76px;border-radius:var(--radius-full);
  background:var(--color-primary);color:var(--color-text-inverse);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:1.8rem;font-weight:700;
}
.profile-username{font-size:var(--text-lg);font-weight:700;}
.profile-email{font-size:var(--text-sm);color:var(--color-text-muted);}
.badge{
  display:inline-flex;align-items:center;gap:var(--space-1);
  padding:var(--space-1) var(--space-3);border-radius:var(--radius-full);
  font-size:var(--text-xs);font-weight:600;letter-spacing:0.03em;
}
.badge-verified{background:var(--color-primary-highlight);color:var(--color-primary);}
.badge-unverified{background:oklch(0.55 0.18 60 / 0.12);color:var(--color-warning);}

.info-list{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-1);}
.info-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:var(--space-3) var(--space-2);border-bottom:1px solid var(--color-divider);
}
.info-row:last-child{border-bottom:none;}
.info-label{font-size:var(--text-sm);color:var(--color-text-muted);}
.info-value{font-size:var(--text-sm);font-weight:600;font-family:var(--font-mono);}

.section-title{font-size:var(--text-sm);font-weight:700;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--color-text-faint);padding:var(--space-6) var(--space-6) 0;}

.form-body{padding:var(--space-6);}
label{display:block;font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted);margin-bottom:var(--space-2);}
input{
  width:100%;padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);
  border-radius:var(--radius-md);border:1px solid var(--color-border);
  background:var(--color-surface-2);color:var(--color-text);
  font-size:var(--text-sm);transition:border-color var(--transition);
}
input:focus{outline:none;border-color:var(--color-primary);}

.btn{
  padding:var(--space-3) var(--space-5);border-radius:var(--radius-md);
  font-size:var(--text-sm);font-weight:600;display:inline-flex;align-items:center;gap:var(--space-2);
}
.btn-primary{background:var(--color-primary);color:var(--color-text-inverse);}
.btn-primary:hover{background:var(--color-primary-hover);}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;}
.btn-danger{background:transparent;color:var(--color-error);border:1px solid var(--color-error);}
.btn-danger:hover{background:oklch(0.55 0.18 25 / 0.1);}
.btn-full{width:100%;justify-content:center;}

.message{
  margin-top:var(--space-4);padding:var(--space-3) var(--space-4);
  border-radius:var(--radius-md);font-size:var(--text-xs);font-weight:500;display:none;
}
.message.error{background:oklch(0.55 0.18 25 / 0.12);color:var(--color-error);display:block;}
.message.success{background:var(--color-primary-highlight);color:var(--color-primary);display:block;}

.loading-state{text-align:center;padding:var(--space-16) 0;color:var(--color-text-faint);font-size:var(--text-sm);}
</style>
</head>
<body>

<header class="site-header">
  <a href="/index.html" class="logo">
    <svg class="logo-mark" viewBox="0 0 36 36" fill="none" aria-hidden="true">
      <rect x="6" y="16" width="24" height="16" rx="3" stroke="currentColor" stroke-width="2.2"/>
      <path d="M12 16v-4a6 6 0 0 1 12 0v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="18" cy="24" r="2.5" fill="currentColor"/>
      <line x1="18" y1="26.5" x2="18" y2="29" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="logo-name">Pass<span>Forge</span></span>
  </a>
  <div class="header-actions">
    <a href="/index.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Back to tools
    </a>
    <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<div class="page-wrap">
  <h1 class="page-title">My Profile</h1>

  <div id="loadingState" class="loading-state">Loading profile...</div>

  <div id="profileContent" style="display:none;">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar" id="avatarInitial">?</div>
        <div style="text-align:center;">
          <p class="profile-username" id="pUsername">—</p>
          <p class="profile-email" id="pEmail">—</p>
        </div>
        <span class="badge" id="pVerifiedBadge">—</span>
      </div>
      <div class="info-list">
        <div class="info-row">
          <span class="info-label">User ID</span>
          <span class="info-value" id="pId">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Member Since</span>
          <span class="info-value" id="pCreated">—</span>
        </div>
      </div>
    </div>

    <div class="profile-card">
      <p class="section-title">Change Password</p>
      <div class="form-body">
        <form id="passwordForm">
          <label for="currentPassword">Current Password</label>
          <input type="password" id="currentPassword" required>
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" required minlength="8">
          <button type="submit" class="btn btn-primary btn-full">Update Password</button>
          <div class="message" id="passwordMessage"></div>
        </form>
      </div>
    </div>

    <div class="profile-card">
      <p class="section-title">Session</p>
      <div class="form-body">
        <button class="btn btn-danger btn-full" id="logoutBtn">Sign Out</button>
      </div>
    </div>
  </div>

  <div id="errorState" style="display:none;text-align:center;padding:var(--space-16) 0;">
    <p style="color:var(--color-text-muted);margin-bottom:var(--space-4);">You need to sign in to view this page.</p>
    <a href="/auth.html" class="btn btn-primary">Sign In</a>
  </div>
</div>

<script>
(function(){
  const t=document.querySelector('[data-theme-toggle]'),r=document.documentElement;
  let d=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  r.setAttribute('data-theme',d);upIcon();
  t&&t.addEventListener('click',()=>{d=d==='dark'?'light':'dark';r.setAttribute('data-theme',d);upIcon();});
  function upIcon(){if(!t)return;
    t.innerHTML=d==='dark'
      ?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      :'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    t.setAttribute('aria-label','Switch to '+(d==='dark'?'light':'dark')+' mode');
  }
})();

const API_BASE = 'https://www.nicelydone.qd.je/api';

function formatDate(iso){
  if(!iso) return '—';
  const dt = new Date(iso);
  return dt.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
}

async function loadProfile(){
  try{
    const res = await fetch(`${API_BASE}/profile`, { credentials: 'include' });
    if(!res.ok){
      document.getElementById('loadingState').style.display='none';
      document.getElementById('errorState').style.display='block';
      return;
    }
    const user = await res.json();

    document.getElementById('avatarInitial').textContent = (user.username || '?').charAt(0).toUpperCase();
    document.getElementById('pUsername').textContent = user.username;
    document.getElementById('pEmail').textContent = user.email;
    document.getElementById('pId').textContent = '#' + user.id;
    document.getElementById('pCreated').textContent = formatDate(user.created_at);

    const badge = document.getElementById('pVerifiedBadge');
    if(user.verified){
      badge.textContent = '✓ Verified';
      badge.className = 'badge badge-verified';
    }else{
      badge.textContent = '⚠ Not Verified';
      badge.className = 'badge badge-unverified';
    }

    document.getElementById('loadingState').style.display='none';
    document.getElementById('profileContent').style.display='block';
  }catch(e){
    document.getElementById('loadingState').style.display='none';
    document.getElementById('errorState').style.display='block';
  }
}
loadProfile();

function showMessage(el, text, type){
  el.textContent = text;
  el.className = 'message ' + type;
}

document.getElementById('passwordForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = e.target.querySelector('button');
  const msg = document.getElementById('passwordMessage');
  btn.disabled = true;

  const currentPassword = document.getElementById('currentPassword').value;
  const newPassword = document.getElementById('newPassword').value;

  try{
    const res = await fetch(`${API_BASE}/profile/password`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ currentPassword, newPassword })
    });
    const data = await res.json();

    if(!res.ok){
      showMessage(msg, data.error || 'Update failed', 'error');
    }else{
      showMessage(msg, data.message || 'Password updated successfully', 'success');
      e.target.reset();
    }
  }catch(err){
    showMessage(msg, 'Network error. Please try again.', 'error');
  }finally{
    btn.disabled = false;
  }
});

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  try{
    await fetch(`${API_BASE}/logout`, { method: 'POST', credentials: 'include' });
  }catch(e){}
  window.location.href = '/index.html';
});
</script>

</body>
</html>
