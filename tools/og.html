<!doctype html><html><head><meta charset="utf-8">

<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0b0c0b;color:#ecebe6;font-family:Geist,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;inset:-30% -10% auto -10%;height:120%;background:radial-gradient(40% 50% at 20% 30%,rgba(126,226,176,.28),transparent 70%),radial-gradient(35% 45% at 85% 10%,rgba(232,201,138,.12),transparent 70%);filter:blur(30px)}

.in{position:absolute;inset:72px 80px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-family:'Instrument Serif';font-size:40px}
.brand em{color:#7ee2b0}
h1{font-family:'Instrument Serif';font-weight:400;font-size:132px;line-height:.92;letter-spacing:-.03em;margin-top:auto}
h1 em{color:#7ee2b0}
.row{display:flex;justify-content:space-between;align-items:end;margin-top:36px;font-family:'Geist Mono';font-size:22px;color:#a6a59f;letter-spacing:.04em}
.pw{font-family:'Geist Mono';font-size:26px;padding:16px 22px;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.04);color:#ecebe6}
.pw b{color:#7ee2b0;font-weight:400}.pw i{color:#e8c98a;font-style:normal}
