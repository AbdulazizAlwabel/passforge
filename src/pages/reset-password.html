<!-- @body -->
<section class="auth" style="grid-template-columns:1fr">
  <div class="auth-main">
    <div class="auth-card">
      <h1 class="h2">Choose a new <em>password</em></h1>
      <p class="muted">Make it long and unique — or let us suggest one.</p>
      <div class="msg err" id="noToken" hidden style="margin-top:20px">{{icon:alert}}<span>This reset link is incomplete. Request a new one from the <a class="link" href="/account/#forgot">sign-in page</a>.</span></div>
      <form id="resetForm" novalidate>
        <div class="field">
          <label class="label" for="p1">New password <button type="button" class="link" style="font-size:.82rem" id="suggest">Suggest a strong one</button></label>
          <div class="input-wrap"><input class="input" type="password" id="p1" autocomplete="new-password" minlength="8" maxlength="128" required><button type="button" class="in-btn" id="eye" aria-label="Show password">{{icon:eye}}</button></div>
          <div class="meter" id="meter" data-level="0" style="margin-top:6px"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="pw-warn" id="warn" hidden></div>
        </div>
        <div class="field"><label class="label" for="p2">Confirm password</label><input class="input" type="password" id="p2" autocomplete="new-password" required></div>
        <div class="msg err" hidden></div>
        <button class="btn btn-primary btn-block" type="submit">Update password</button>
      </form>
    </div>
  </div>
</section>

<!-- @script -->
<script>
(function(){
  const $=ND.$;
  const token=new URLSearchParams(location.search).get('token')||'';
  if(!/^[a-f0-9]{64}$/.test(token)){$('#noToken').hidden=false;$('#resetForm').hidden=true;}
  history.replaceState(null,'',location.pathname);
  const lvl=pw=>{if(!pw)return 0;let p=0;if(/[a-z]/.test(pw))p+=26;if(/[A-Z]/.test(pw))p+=26;if(/\d/.test(pw))p+=10;if(/[^A-Za-z0-9]/.test(pw))p+=33;const b=pw.length*Math.log2(p||1);return b<28?1:b<45?2:b<64?3:b<90?4:5;};

  let pwnT,pwnSeq=0;
  function warnLeak(input,el){clearTimeout(pwnT);const my=++pwnSeq;el.hidden=true;const v=input.value;if(v.length<6)return;pwnT=setTimeout(async()=>{const n=await ND.pwned(v);if(my===pwnSeq&&n>0){el.textContent=ND.f('⚠ This password appeared in {count} — please choose a different one.',{count:ND.count(n,{one:'data breach',other:'data breaches'},{one:'تسريب',two:'تسريبين',few:'تسريبات',many:'تسريبًا',other:'تسريب'})});el.hidden=false;}},500);}
  $('#p1').addEventListener('input',()=>{$('#meter').dataset.level=lvl($('#p1').value);warnLeak($('#p1'),$('#warn'));});
  $('#eye').addEventListener('click',function(){const s=$('#p1').type==='password';$('#p1').type=$('#p2').type=s?'text':'password';this.innerHTML=s?'{{icon:eye_off}}':'{{icon:eye}}';});
  $('#suggest').addEventListener('click',()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*-_=+?';let s='';for(let i=0;i<20;i++)s+=A[ND.randInt(A.length)];$('#p1').value=$('#p2').value=s;$('#p1').type=$('#p2').type='text';$('#meter').dataset.level=lvl(s);ND.copy(s,null,'Suggested password copied');});
  $('#resetForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const er=e.target.querySelector('.msg.err'),btn=e.target.querySelector('[type=submit]'),a=$('#p1').value,b=$('#p2').value;
    er.hidden=true;
    if(a.length<8){er.textContent='Use at least 8 characters.';er.hidden=false;return;}
    if(a!==b){er.textContent='The two passwords don’t match.';er.hidden=false;return;}
    btn.disabled=true;
    const r=await ND.api('/reset-password',{method:'POST',body:{token,password:a}});
    btn.disabled=false;
    if(r.ok)location.href=ND.url('/account/?reset=1');else{er.textContent=r.data.error||'Something went wrong.';er.hidden=false;}
  });
})();
</script>
