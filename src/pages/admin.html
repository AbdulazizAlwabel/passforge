<!-- @body -->
<section class="tool-hero">
  <div class="wrap">
    <p class="eyebrow"><span class="dot"></span>Administration</p>
    <h1 class="h1" style="margin-top:20px">Admin <em>console</em></h1>
    <div class="msg err" id="denied" hidden style="margin-top:24px">{{icon:alert}}<span id="deniedTxt">You don’t have access to this page.</span></div>

    <div id="content" hidden>
      <div class="stat-grid" style="margin-top:32px" id="kpis"></div>

      <div class="row between" style="margin-top:40px;margin-bottom:14px">
        <h2 class="h2" style="font-size:1.8rem">Users</h2>
        <input class="input" id="filter" placeholder="Filter by name or email…" style="max-width:280px;height:40px" autocomplete="off">
      </div>
      <div class="table-wrap"><table class="data"><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Status</th><th>Joined</th><th></th></tr></thead><tbody id="users"></tbody></table></div>

      <h2 class="h2" style="font-size:1.8rem;margin:40px 0 14px">Tool suggestions <span class="badge" id="pendingBadge" hidden></span></h2>
      <div class="table-wrap"><table class="data"><thead><tr><th>Suggestion</th><th>Status</th><th>Votes</th><th>Date</th><th></th></tr></thead><tbody id="sugg"></tbody></table></div>

      <h2 class="h2" style="font-size:1.8rem;margin:40px 0 14px">Recent email tokens</h2>
      <div class="table-wrap"><table class="data"><thead><tr><th>User</th><th>Type</th><th>State</th><th>Created</th><th>Expires</th></tr></thead><tbody id="tokens"></tbody></table></div>
    </div>
  </div>
</section>

<!-- @script -->
<script>
(function(){
  const $=ND.$;let users=[];
  const d=iso=>iso?new Date(iso).toLocaleString(ND.lang==='ar'?'ar-u-nu-latn':'en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
  function deny(t){$('#denied').hidden=false;$('#deniedTxt').textContent=t;}
  async function load(){
    const [u,t]=await Promise.all([ND.api('/admin/users'),ND.api('/admin/tokens')]);
    if(!u.ok){deny(u.status===401?'Please sign in with an admin account.':u.data.error||'You don’t have access to this page.');return;}
    users=u.data;$('#content').hidden=false;
    const verified=users.filter(x=>x.verified).length,week=users.filter(x=>Date.now()-new Date(x.created_at)<7*864e5).length;
    $('#kpis').innerHTML=[['Total users',users.length],['Verified',verified],['Unverified',users.length-verified],['Joined this week',week]].map(([k,v])=>'<div class="stat"><div class="k">'+k+'</div><div class="v" style="font-family:var(--font-display);font-size:2rem">'+v+'</div></div>').join('');
    renderUsers();
    const tk=t.ok?t.data:[];
    $('#tokens').innerHTML=tk.length?tk.map(x=>{const exp=new Date(x.expires_at)<new Date();return '<tr><td>'+ND.esc(x.username)+'</td><td>'+(x.type==='verify_email'?'Verify email':'Reset password')+'</td><td>'+(x.used?'<span class="badge ok">Used</span>':exp?'<span class="badge">Expired</span>':'<span class="badge info">Active</span>')+'</td><td>'+d(x.created_at)+'</td><td>'+d(x.expires_at)+'</td></tr>';}).join(''):'<tr><td colspan="5" class="faint">No tokens yet.</td></tr>';
  }
  function renderUsers(){
    const f=$('#filter').value.trim().toLowerCase();
    const list=users.filter(x=>!f||x.username.toLowerCase().includes(f)||x.email.toLowerCase().includes(f));
    $('#users').innerHTML=list.length?list.map(x=>'<tr><td class="mono faint">#'+x.id+'</td><td>'+ND.esc(x.username)+'</td><td>'+ND.esc(x.email)+'</td><td>'+(x.verified?'<span class="badge ok">Verified</span>':'<span class="badge">Unverified</span>')+'</td><td>'+d(x.created_at)+'</td><td style="text-align:end">'+(x.verified?'':'<button class="btn btn-sm" data-verify="'+x.id+'">Verify</button> ')+'<button class="btn btn-sm btn-danger" data-del="'+x.id+'" data-name="'+ND.esc(x.username)+'">Delete</button></td></tr>').join(''):'<tr><td colspan="6" class="faint">No users match.</td></tr>';
  }
  $('#filter').addEventListener('input',renderUsers);
  $('#users').addEventListener('click',async e=>{
    const v=e.target.closest('[data-verify]'),del=e.target.closest('[data-del]');
    if(v){const r=await ND.api('/admin/users/'+v.dataset.verify+'/verify',{method:'PUT'});ND.toast(r.ok?'User verified':(r.data.error||'Failed'));if(r.ok)load();}
    if(del){if(!confirm(ND.f('Delete user “{name}”? This can’t be undone.',{name:del.dataset.name})))return;const r=await ND.api('/admin/users/'+del.dataset.del,{method:'DELETE'});ND.toast(r.ok?'User deleted':(r.data.error||'Failed'));if(r.ok)load();}
  });
  async function loadSugg(){
    const r=await ND.api('/admin/suggestions');if(!r.ok)return;
    const pend=r.data.filter(x=>x.status==='pending').length;
    $('#pendingBadge').hidden=!pend;$('#pendingBadge').textContent=ND.f('{n} waiting for review',{n:pend});
    const S={pending:'<span class="badge info">Pending</span>',open:'<span class="badge ok">Public</span>',planned:'<span class="badge info">Planned</span>',done:'<span class="badge ok">Done</span>',declined:'<span class="badge">Declined</span>'};
    const act=(id,st,txt)=>'<button class="btn btn-sm" data-s="'+id+'" data-st="'+st+'">'+txt+'</button> ';
    $('#sugg').innerHTML=r.data.length?r.data.map(x=>'<tr><td style="white-space:normal;min-width:240px"><b>'+ND.esc(x.title)+'</b>'+(x.details?'<div class="faint" style="font-size:.82rem">'+ND.esc(x.details)+'</div>':'')+'</td><td>'+S[x.status]+'</td><td class="mono">'+x.votes+'</td><td>'+d(x.created_at)+'</td><td style="text-align:end;white-space:nowrap">'+
      (x.status==='pending'?act(x.id,'open','Approve'):'')+(x.status!=='planned'&&x.status!=='pending'?act(x.id,'planned','Planned'):'')+(x.status!=='done'&&x.status!=='pending'?act(x.id,'done','Done'):'')+(x.status!=='declined'?act(x.id,'declined','Decline'):'')+
      '<button class="btn btn-sm btn-danger" data-sdel="'+x.id+'">Delete</button></td></tr>').join(''):'<tr><td colspan="5" class="faint">No suggestions yet.</td></tr>';
  }
  $('#sugg').addEventListener('click',async e=>{
    const b=e.target.closest('[data-st]'),del=e.target.closest('[data-sdel]');
    if(b){const r=await ND.api('/admin/suggestions/'+b.dataset.s,{method:'PUT',body:{status:b.dataset.st}});ND.toast(r.ok?'Updated':(r.data.error||'Failed'));loadSugg();}
    if(del&&confirm(ND.t('Delete this suggestion?'))){const r=await ND.api('/admin/suggestions/'+del.dataset.sdel,{method:'DELETE'});ND.toast(r.ok?'Deleted':(r.data.error||'Failed'));loadSugg();}
  });
  ND.me.then(m=>{if(m&&m.admin)loadSugg();});
  ND.me.then(m=>{if(m===null)deny('Accounts aren’t available on this deployment.');else if(!m)deny('Please sign in with an admin account.');else load();});
})();
</script>
